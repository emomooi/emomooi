<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>订单查询</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:#F5F7F6;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
       display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;}
  .box{background:#fff;border-radius:12px;padding:28px;max-width:520px;width:100%;
       box-shadow:0 4px 24px rgba(0,0,0,.06);}
  h1{font-size:20px;color:#2A9D8F;margin:0 0 20px;font-weight:600;}
  input{width:100%;padding:11px 12px;border:1px solid #dfe3e8;border-radius:8px;
        font-size:14px;margin-bottom:12px;outline:none;}
  input:focus{border-color:#2A9D8F;}
  button{width:100%;background:#2A9D8F;color:#fff;border:0;border-radius:8px;
         padding:12px;font-size:15px;font-weight:600;cursor:pointer;}
  button:disabled{background:#A8C9C4;cursor:default;}
  .row{font-size:14px;color:#555;line-height:2;border-bottom:1px solid #F0F3F2;
       padding:6px 0;display:flex;justify-content:space-between;gap:12px;}
  .row b{color:#333;font-weight:600;word-break:break-all;text-align:right;}
  .code{font-size:20px;font-family:Consolas,monospace;font-weight:700;color:#1F6B60;
        background:#E8F5F3;border-radius:8px;padding:14px;margin:16px 0;
        word-break:break-all;user-select:all;text-align:center;letter-spacing:.5px;}
  .ok{color:#2A9D8F;}
  .bad{color:#C0392B;}
  .hint{font-size:12px;color:#8A94A6;margin-top:16px;line-height:1.8;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="box">
  <h1>订单查询</h1>

  <div id="formArea">
    <input id="keyInput" type="password" placeholder="管理员密钥" autocomplete="off">
    <input id="orderInput" type="text" placeholder="订单号 ord-xxx" autocomplete="off">
    <button id="btnQuery">查询</button>
    <div class="hint">密钥只保存在这台浏览器本地，不会上传到任何地方。</div>
  </div>

  <div id="resultArea" class="hidden">
    <div id="resultBody"></div>
    <button id="btnBack" style="background:#8A94A6;margin-top:18px;">再查一个</button>
  </div>
</div>

<script>
var API = 'https://license-verify-ygtfptyajy.cn-hangzhou.fcapp.run/admin/order/query';
var KEY_STORE = 'dwAdminKey';

var keyInput = document.getElementById('keyInput');
var orderInput = document.getElementById('orderInput');
var btnQuery = document.getElementById('btnQuery');
var formArea = document.getElementById('formArea');
var resultArea = document.getElementById('resultArea');
var resultBody = document.getElementById('resultBody');
var btnBack = document.getElementById('btnBack');

// 读回上次输入的密钥和订单号
try {
  keyInput.value = localStorage.getItem(KEY_STORE) || '';
} catch (e) {}

function esc(s) {
  return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) {
    return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c];
  });
}

function fmtTime(ts) {
  if (!ts) return '—';
  try { return new Date(Number(ts)).toLocaleString('zh-CN'); } catch (e) { return '—'; }
}

btnQuery.addEventListener('click', function () {
  var key = (keyInput.value || '').trim();
  var order = (orderInput.value || '').trim();
  if (!key) { alert('请输入管理员密钥'); return; }
  if (!order) { alert('请输入订单号'); return; }

  try { localStorage.setItem(KEY_STORE, key); } catch (e) {}

  btnQuery.disabled = true;
  btnQuery.textContent = '查询中…';

  var url = API + '?key=' + encodeURIComponent(key) + '&order=' + encodeURIComponent(order);
  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      btnQuery.disabled = false;
      btnQuery.textContent = '查询';
      if (!d || !d.ok) {
        alert((d && d.reason) || '查询失败');
        return;
      }
      showResult(d);
    })
    .catch(function (e) {
      btnQuery.disabled = false;
      btnQuery.textContent = '查询';
      alert('网络错误：' + (e.message || e));
    });
});

function showResult(d) {
  var paid = d.status === 'paid';
  var html = '';
  html += '<div class="row"><span>订单号</span><b>' + esc(orderInput.value) + '</b></div>';
  html += '<div class="row"><span>邮箱</span><b>' + esc(d.email) + '</b></div>';
  html += '<div class="row"><span>金额</span><b>' + esc(d.amount) + ' 元</b></div>';
  html += '<div class="row"><span>状态</span><b class="' + (paid ? 'ok' : 'bad') + '">'
        + esc(d.status) + (d.reconciled ? '（已自动补单）' : '') + '</b></div>';
  html += '<div class="row"><span>创建时间</span><b>' + esc(fmtTime(d.createdAt)) + '</b></div>';
  html += '<div class="row"><span>支付时间</span><b>' + esc(fmtTime(d.paidAt)) + '</b></div>';
  if (paid && d.code) {
    html += '<div class="code">' + esc(d.code) + '</div>';
    html += '<div class="hint">激活码可直接复制发给用户。</div>';
  } else {
    html += '<div class="hint bad" style="margin-top:14px;">尚未支付或补单失败，没有激活码。</div>';
  }
  resultBody.innerHTML = html;
  formArea.classList.add('hidden');
  resultArea.classList.remove('hidden');
}

btnBack.addEventListener('click', function () {
  resultArea.classList.add('hidden');
  formArea.classList.remove('hidden');
  orderInput.value = '';
  orderInput.focus();
});
</script>
</body>
</html>
