<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支付成功 - 网文维权助手</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:#F5F7F6;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .box{background:#fff;border-radius:14px;padding:34px 30px;max-width:460px;width:100%;
       box-shadow:0 4px 24px rgba(0,0,0,.06);text-align:center;}
  .tick{width:56px;height:56px;border-radius:50%;background:#2A9D8F;color:#fff;
        font-size:30px;line-height:56px;margin:0 auto 18px;font-weight:600;}
  h1{font-size:20px;color:#1F6B60;margin:0 0 16px;font-weight:600;}
  p{font-size:14px;color:#555;line-height:1.9;margin:0 0 14px;}
  .find{font-size:13px;color:#555;line-height:1.9;margin:18px 0 8px;
        padding:14px 16px;background:#F5F7FA;border-radius:8px;text-align:left;}
  .find b{color:#2F3542;}
  .orderbox{background:#F5F7FA;border-radius:8px;padding:14px 12px;margin:10px 0 16px;}
  .orderid{font-family:Consolas,monospace;font-size:13px;color:#2F3542;
           word-break:break-all;user-select:all;margin-bottom:10px;}
  button{background:#2A9D8F;color:#fff;border:0;border-radius:6px;
         padding:9px 18px;font-size:13px;cursor:pointer;}
  .hint{font-size:12px;color:#8A94A6;line-height:1.8;margin-top:14px;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="box">
  <div class="tick">✓</div>
  <h1>支付成功</h1>

  <p>激活码会显示在插件的购买窗口里，同时也发送到了你填写的邮箱<br>（注意查看垃圾邮件）。</p>

  <div class="find">
    <b>如果都没收到，可以凭下面这个订单号找回：</b><br>
    插件 → 会员中心 → 凭订单号找回
  </div>

  <div id="orderArea" class="orderbox hidden">
    <div class="orderid" id="orderId"></div>
    <button id="btnCopy">复制订单号</button>
  </div>

  <div id="noOrder" class="hint hidden">
    没拿到订单号？可以在支付宝 App → 账单 → 这笔付款 → 详情 里找到「商家订单号」。
  </div>

  <div class="hint">订单号也能在支付宝 App → 账单 → 这笔付款 → 详情 里找到。</div>
</div>

<script>
var orderId = (new URLSearchParams(location.search).get('order') || '').trim();

var orderArea = document.getElementById('orderArea');
var orderIdEl = document.getElementById('orderId');
var noOrder = document.getElementById('noOrder');
var btnCopy = document.getElementById('btnCopy');

if (orderId) {
  orderIdEl.textContent = orderId;
  orderArea.classList.remove('hidden');

  btnCopy.addEventListener('click', function () {
    function ok() {
      btnCopy.textContent = '已复制';
      setTimeout(function () { btnCopy.textContent = '复制订单号'; }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(orderId).then(ok).catch(function () {
        btnCopy.textContent = '复制失败，请手动选中';
      });
    } else {
      var r = document.createRange();
      r.selectNodeContents(orderIdEl);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      btnCopy.textContent = '已选中，请手动复制';
    }
  });
} else {
  noOrder.classList.remove('hidden');
}
</script>
</body>
</html>
